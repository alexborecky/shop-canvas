name = "shoptet-canvas"
main = "worker/worker.ts"
compatibility_date = "2025-05-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
preview_urls = true

# Custom domain — set to your own, or leave commented to use the workers.dev URL.
# [[routes]]
# pattern = "canvas.example.com"
# custom_domain = true

[observability]
enabled = true

# Static frontend (vite build output). API + sync paths always hit the worker first.
[assets]
not_found_handling = "single-page-application"
directory = "./dist/client"
run_worker_first = ["/api/*", "/parties/*"]

# One Durable Object per board. Binding name "Board" => party "board" => /parties/board/:id
[durable_objects]
bindings = [{ name = "Board", class_name = "BoardServer" }]

# Durable Object classes need migrations. Never edit an existing tag after deploying; add a new one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardServer"]

# Uploaded images
[[r2_buckets]]
binding = "BOARD_FILES"
bucket_name = "shoptet-canvas-uploads"
preview_bucket_name = "shoptet-canvas-uploads-preview"
